name: CI

on:
  push:
  ##  branches:
  ##    - main
  pull_request:
  ##  branches:
  ##    - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository Checkout
        uses: actions/checkout@v5
      
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: run tests
        run: ./gradlew test