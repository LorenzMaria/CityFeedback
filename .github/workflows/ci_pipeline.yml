name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm install
      
      - name: build project
        run: npm run build
      
      - name: run tests
        run: npm test